name: Student Timetable Tracker CI

on:
  push:
    branches:
      - master

  pull_request:
    branches:
      - master

jobs:
  laravel-tests:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup PHP
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_sqlite, sqlite3

      # 3. Cache Composer dependencies
      - name: Cache Composer Dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      # 4. Install PHP dependencies
      - name: Install Composer Dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      # 5. Check Laravel code formatting
      - name: Check Code Formatting (Laravel Pint)
        run: vendor/bin/pint --test

      # 6. Setup Node.js with npm cache
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      # 7. Install frontend dependencies
      - name: Install Frontend Dependencies
        run: npm ci

      # 8. Build frontend assets
      - name: Build Frontend Assets
        run: npm run build
      # 9. Directory Permission
      - name: Set Directory Permissions
        run: chmod -R 775 storage bootstrap/cache


      # 10. Prepare environment
      - name: Prepare Environment
        run: |
          cp .env.example .env
          php artisan key:generate
          touch database/database.sqlite

      # 11. Configure SQLite
      - name: Configure SQLite Database
        run: |
          sed -i 's/^DB_CONNECTION=.*/DB_CONNECTION=sqlite/' .env
          sed -i '/^DB_DATABASE=/d' .env

      # 12. Run migrations
      - name: Run Migrations
        run: php artisan migrate --force

      # 13. Run automated tests
      - name: Run Tests
        run: php artisan test
